{% extends "auth_base.html" %}
{% block title %}Password reset{% endblock %}

{% block auth_content %}
<div class="success-message success-message-visible">
    <div class="success-icon">&#10003;</div>
    <div class="login-header">
        <h2>Password Set!</h2>
        <p>Your security credentials have been updated successfully.</p>
    </div>
</div>

<div class="auth-copy auth-mb-32">
    <p>You can now use your new password to access your account.</p>
</div>

<div class="auth-center">
    <a href="{% url 'login' %}" class="btn login-btn auth-btn-link">
        <span class="btn-text">Log in now</span>
    </a>
</div>
{% endblock %}
