{% extends "auth_base.html" %}

{% block title %}Welcome{% endblock %}

{% block auth_content %}
<div class="success-message success-message-visible">
    <div class="success-icon">&#10003;</div>
    <h3>Welcome {{ new_user.username }}!</h3>
    <p>Your account has been successfully created.</p>
</div>

<div class="btn login-btn auth-btn-flat auth-mt-20">
    <a href="{% url 'login' %}" class="auth-btn-link">Log in Now</a>
</div>
{% endblock %}
